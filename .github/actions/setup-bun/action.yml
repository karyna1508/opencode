name: "Setup Bun"
description: "Setup Bun with caching and install dependencies"
runs:
  using: "composite"
  steps:
    - name: Get baseline download URL
      id: bun-url
      shell: bash
      run: |
        if [ "$RUNNER_ARCH" = "X64" ]; then
          V=$(node -p "require('./package.json').packageManager.split('@')[1]")
          case "$RUNNER_OS" in
            macOS)   OS=darwin ;;
            Linux)   OS=linux ;;
            Windows) OS=windows ;;
          esac
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ !steps.bun-url.outputs.url && 'package.json' || '' }}
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    - name: Get cache directory
      id: cache
      shell: bash
      run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

    - name: Debug Bun lock visibility
      shell: bash
      run: |
        #region agent log
        python3 - <<'PY'
        import glob
        import json
        import os
        import time

        path = "/Users/karyna/Documents/goLearn/ci_improvement/opencode/.cursor/debug-e429ad.log"
        workspace = os.environ.get("GITHUB_WORKSPACE", "")
        pwd = os.getcwd()
        locks = glob.glob("**/bun.lock", recursive=True)
        rows = []
        for f in locks[:20]:
          rows.append({
            "path": f,
            "abs": os.path.abspath(f),
            "exists": os.path.exists(f),
            "readable": os.access(f, os.R_OK),
          })
        data = {
          "workspace": workspace,
          "pwd": pwd,
          "lock_count": len(locks),
          "locks_preview": rows,
          "workspace_exists": os.path.exists(workspace) if workspace else False,
          "workspace_readable": os.access(workspace, os.R_OK) if workspace else False,
        }
        log = {
          "sessionId": "e429ad",
          "runId": "pre-fix-1",
          "hypothesisId": "H1",
          "location": ".github/actions/setup-bun/action.yml:Debug Bun lock visibility",
          "message": "workspace and bun.lock discovery before actions/cache hashFiles",
          "data": data,
          "timestamp": int(time.time() * 1000),
        }
        with open(path, "a", encoding="utf-8") as fh:
          fh.write(json.dumps(log) + "\n")
        PY
        #endregion

    - name: Debug environment for cache key
      shell: bash
      run: |
        #region agent log
        python3 - <<'PY'
        import json
        import os
        import time

        path = "/Users/karyna/Documents/goLearn/ci_improvement/opencode/.cursor/debug-e429ad.log"
        data = {
          "runner_os": os.environ.get("RUNNER_OS", ""),
          "runner_arch": os.environ.get("RUNNER_ARCH", ""),
          "github_workspace": os.environ.get("GITHUB_WORKSPACE", ""),
          "github_action_path": os.environ.get("GITHUB_ACTION_PATH", ""),
          "github_repository": os.environ.get("GITHUB_REPOSITORY", ""),
        }
        log = {
          "sessionId": "e429ad",
          "runId": "pre-fix-1",
          "hypothesisId": "H2",
          "location": ".github/actions/setup-bun/action.yml:Debug environment for cache key",
          "message": "runner environment before cache key expression evaluation",
          "data": data,
          "timestamp": int(time.time() * 1000),
        }
        with open(path, "a", encoding="utf-8") as fh:
          fh.write(json.dumps(log) + "\n")
        PY
        #endregion

    - name: Compute lock hash
      id: lock
      shell: bash
      run: |
        #region agent log
        python3 - <<'PY'
        import hashlib
        import json
        import os
        import time

        path = "/Users/karyna/Documents/goLearn/ci_improvement/opencode/.cursor/debug-e429ad.log"
        out = os.environ["GITHUB_OUTPUT"]
        files = [
          "bun.lock",
          "github/bun.lock",
          "packages/console/resource/bun.lock",
          "sdks/vscode/bun.lock",
        ]
        hits = [f for f in files if os.path.exists(f)]
        if not hits:
          key = "nolock"
        else:
          h = hashlib.sha256()
          for f in hits:
            h.update(f.encode("utf-8"))
            with open(f, "rb") as fh:
              h.update(fh.read())
          key = h.hexdigest()
        with open(out, "a", encoding="utf-8") as fh:
          fh.write(f"value={key}\n")
        log = {
          "sessionId": "e429ad",
          "runId": "pre-fix-2",
          "hypothesisId": "H6",
          "location": ".github/actions/setup-bun/action.yml:Compute lock hash",
          "message": "computed lock hash without hashFiles expression",
          "data": {"files": hits, "key": key, "count": len(hits)},
          "timestamp": int(time.time() * 1000),
        }
        with open(path, "a", encoding="utf-8") as fh:
          fh.write(json.dumps(log) + "\n")
        PY
        #endregion

    - name: Cache Bun dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ steps.lock.outputs.value }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install setuptools for distutils compatibility
      run: python3 -m pip install setuptools || pip install setuptools || true
      shell: bash

    - name: Install dependencies
      run: |
        # Workaround for patched peer variants
        # e.g. ./patches/ for standard-openapi
        # https://github.com/oven-sh/bun/issues/28147
        if [ "$RUNNER_OS" = "Windows" ]; then
          bun install --linker hoisted
        else
          bun install
        fi
      shell: bash
